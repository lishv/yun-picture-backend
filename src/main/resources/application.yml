server:
  port: 8123
  servlet:
    context-path: /api
  # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

spring:
  application:
    name: yun-picture-backend-ddd
  #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.200.128:3306/yun_picture
    username: root
    password: L2570410870
  #开放servlet更大的上传限制,默认1MB
  servlet:
    multipart:
      max-file-size: 10MB
  #redis配置
  redis:
    database: 1 # 选择数据库1
    host: 192.168.200.128
    port: 6379
    password: L2570410870
    timeout: 5000
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000

  # 空间图片分表
  shardingsphere:
    datasource:
      names: yun_picture
      yun_picture:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://192.168.200.128:3306/yun_picture
        username: root
        password: L2570410870
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: yun_picture.picture # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId  #根据某一列进行分表
                sharding-algorithm-name: picture_sharding_algorithm # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: standard
              algorithmClassName: com.xiaoli.yunpicture.shared.sharding.PictureShardingAlgorithm
    props:
      sql-show: true

    # rabbitmq 配置
  rabbitmq:
    # 后端 JAR 与 RabbitMQ 位于同一台宝塔服务器时使用本机地址；异机运行可用环境变量覆盖。
    host: ${RABBITMQ_HOST:127.0.0.1}  # RabbitMQ 服务器地址
    port: ${RABBITMQ_PORT:5672}  # RabbitMQ java 客户端端口
    username: ${RABBITMQ_USERNAME:yun_picture}  # RabbitMQ 用户名
    password: 'L2570410870'  # RabbitMQ 密码
    virtual-host: ${RABBITMQ_VHOST:/yun-picture}  # RabbitMQ 虚拟主机
    connection-timeout: 5s  # RabbitMQ 连接超时时间
    publisher-confirm-type: correlated  # 发布确认类型，correlated 为默认值
    publisher-returns: true  # 开启发布返回，消息不可路由时回调 ReturnCallback 返回给生产者
    template:
      mandatory: true  # 强制模式，消息不可路由时返回给生产者（false 则直接丢弃）
    #rabbitmq 消费者配置
    listener:
      simple:
        acknowledge-mode: auto  #自动确认模式，处理成功自动 ack,处理失败为 nack
        concurrency: 1 #最小并发消费者线程数
        max-concurrency: 2 #最大并发消费者线程数
        prefetch: 5 #每个消费者预取消息数量，控制分发均衡性
        default-requeue-rejected: false #被拒绝消息是否重新入队，false 防止死循环

#mybatis-plus配置
mybatis-plus:
  configuration:
    # 映射语句名称的自动匹配:关,因为全部使用驼峰命名法
    map-underscore-to-camel-case: false
    # 开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 逻辑删除字段名
      logic-delete-value: 1 # 逻辑删除值
      logic-not-delete-value: 0 # 逻辑未删除值
    enable-sql-runner: true # 开启 SqlRunner 功能



#接口文档配置
knife4j:
  enable: true
  openapi:
    title: 接口文档
    description: "绘灵云图片协作平台接口文档"
    email: 13866867523@126.com
    concat: xiaoli
    url: https://github.com/lishv
    version: 1.0
    license: Apache 2.0
    license-url: https://stackoverflow.com/
    terms-of-service-url: https://stackoverflow.com/
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.xiaoli.yunpicture.interfaces.controller
