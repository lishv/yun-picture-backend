server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

spring:
  application:
    name: yun-picture-backend
  #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.200.128:3306/yun_picture
    username: root
    password: L2570410870
  #开放servlet更大的上传限制,默认1MB
  servlet:
    multipart:
      max-file-size: 10MB
  #redis配置
  redis:
    database: 1 # 选择数据库1
    host: 192.168.200.128
    port: 6379
    password: L2570410870
    timeout: 5000
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000

#mybatis-plus配置
mybatis-plus:
  configuration:
    # 映射语句名称的自动匹配:关,因为全部使用驼峰命名法
    map-underscore-to-camel-case: false
    # 开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 逻辑删除字段名
      logic-delete-value: 1 # 逻辑删除值
      logic-not-delete-value: 0 # 逻辑未删除值



#接口文档配置
knife4j:
  enable: true
  openapi:
    title: 接口文档
    description: "智能协同云图库接口文档"
    email: xiaoli@foxmail.com
    concat: xiaoli
    url: https://docs.xiaoli.com
    version: 1.0
    license: Apache 2.0
    license-url: https://stackoverflow.com/
    terms-of-service-url: https://stackoverflow.com/
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.xiaoli.yunpicturebackend.controller
